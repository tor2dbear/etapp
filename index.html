<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Browser UI (status bar) color; app.js keeps it in sync with the active
         theme, including the in-app light/dark toggle. -->
    <meta name="theme-color" content="#f4efe4" />
    <!-- title / description are defaults; app.js overrides them from board.config.json -->
    <title>Roadmap</title>
    <meta
      name="description"
      content="An aggregated roadmap across repos — truth in git, one board."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-0.5 -0.5 24 24' fill='none' stroke='%23c07682' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.375 17.25a2.875 2.875 0 1 0 5.75 0 2.875 2.875 0 1 0 -5.75 0'/%3E%3Cpath d='M2.875 5.75a2.875 2.875 0 1 0 5.75 0 2.875 2.875 0 1 0 -5.75 0'/%3E%3Cpath d='M5.75 20.125V8.625a8.625 8.625 0 0 0 8.625 8.625'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="preload">
    <!-- The sync run's only visible sign while it lasts. Fixed to the top of the
         viewport rather than placed in the chrome, because the two places the wait is
         actually spent — scrolled down the board, and inside a puck — are exactly where
         the footer's `syncing…` and the sidebar both stop being visible. -->
    <div class="syncbar" id="syncBar" hidden></div>
    <div class="app" id="app">
      <!-- ── left sidebar: identity + navigation ── -->
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <!-- Linear-style header row: workspace button (glyph + title + caret) on the
             left; search + New as icon buttons on the right. The account menu lives
             on the workspace button; the git-merge glyph + icons are injected via JS. -->
        <div class="side-brand brand">
          <button class="ws-btn" id="wsBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Workspace menu">
            <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
            <h1>Roadmap</h1>
            <span class="ws-caret" aria-hidden="true"></span>
          </button>
          <div class="side-head-actions">
            <button id="sideSearch" class="head-act" type="button" aria-label="Search"></button>
            <button id="sideNew" class="head-act" type="button" aria-label="New puck" hidden></button>
          </div>
        </div>
        <!-- The group headings are emitted by JS, not written here: which groups
             exist is a property of the views (see VIEW_GROUPS), and a heading in
             the markup would outlive the rows it names. -->
        <div class="side-section">
          <nav class="side-views" id="sideViews" aria-label="Views"></nav>
        </div>
        <!-- Saved views: named queries from board.config.json (config, not truth);
             hidden until the instance defines one -->
        <div class="side-section" id="savedSection" hidden>
          <div class="side-eyebrow">Saved</div>
          <nav class="side-views" id="savedViews" aria-label="Saved views"></nav>
        </div>
        <!-- PO-console: per-discipline agent queues; hidden until pucks are routed -->
        <div class="side-section" id="agentSection" hidden>
          <div class="side-eyebrow">Agents</div>
          <div class="side-repos" id="agentFilters" aria-label="Agent queues"></div>
        </div>
        <div class="side-section" id="repoSection">
          <div class="side-eyebrow">Repos</div>
          <div class="side-repos" id="repoFilters" aria-label="Repositories"></div>
        </div>
      </aside>

      <!-- ── main column: topbar + work ── -->
      <div class="maincol">
        <!-- desktop-only drag handle to resize the sidebar -->
        <div class="col-resizer" id="colResizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
        <!-- mobile-only: sidebar (with search + New) is behind the menu, so mirror
             the quick actions here; hidden on desktop where the sidebar is visible -->
        <header class="topbar">
          <!-- menu stays in puck mode too, so nav is always reachable; icon injected via icon("sidebar") -->
          <button id="menuToggle" class="ghost menu-toggle" type="button" aria-label="Menu"></button>
          <!-- The title is the view switcher (see buildViewSwitch): it is already the
               name of the current view, on both widths, so it is where a reader
               looks to learn which view they are in — and therefore where they
               should be able to change it. -->
          <div class="top-title view-switch">
            <button class="view-switch-btn" id="topTitleBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <span id="topTitle" class="view-title">All pucks</span>
              <span id="topCount" class="view-count"></span>
              <span class="vs-caret" aria-hidden="true"></span>
            </button>
          </div>
          <!-- puck mode: breadcrumb (Pucks › Title) replaces the board title; the
               "Pucks" segment is the back action -->
          <nav class="top-crumb" id="topCrumb" aria-label="Breadcrumb"></nav>
          <button id="topNew" class="ghost top-new" type="button" aria-label="New puck" hidden></button>
          <button id="topSearch" class="ghost top-search" type="button" aria-label="Search (Cmd/Ctrl+K)"></button>
          <!-- icon injected in JS via icon("share") so it matches the puck's Copy-link glyph (tray + up-arrow) -->
          <button id="topShare" class="ghost top-share-btn" type="button" aria-label="Share puck"></button>
        </header>

        <!-- consistent view-header: current view + view-options (stays as you navigate/open pucks) -->
        <header class="vhead">
          <h2 class="vhead-h view-switch">
            <button class="view-switch-btn" id="viewTitleBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="view-title" id="viewTitle">All pucks</span>
              <span class="view-count" id="viewCount"></span>
              <span class="vs-caret" aria-hidden="true"></span>
            </button>
          </h2>
          <div class="vopts" id="viewActions">
            <div class="filter-wrap">
              <button id="filterBtn" class="ghost filter-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Filter">
                <span>Filter</span>
                <span id="filterCount" class="filter-count" hidden></span>
              </button>
            </div>
            <!-- Display owns how the chosen pucks are presented: layout · grouping ·
                 ordering · what's included wholesale (the archive, empty groups).
                 Not "View" — the sidebar already owns Views as navigation. -->
            <div class="filter-wrap">
              <button id="displayBtn" class="ghost filter-btn display-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Display options">
                <span>Display</span>
                <span id="displayDot" class="display-dot" hidden aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </header>

        <!-- active filters, one chip per predicate; hidden when nothing is filtered -->
        <div class="chiprow" id="chipRow" hidden></div>

        <div class="work" id="work">
          <main id="board" class="board" aria-live="polite"></main>
          <aside class="detail-pane" id="detailPane" hidden aria-label="Puck detail">
            <button class="detail-close" id="detailClose" type="button" aria-label="Close"></button>
            <div class="detail-content" id="detailContent"></div>
          </aside>
        </div>

        <footer class="foot">
          <span id="footmeta"></span>
          <!-- The repair sits beside the date it repairs: footmeta ends with the harvest
               time, and this asks CI for a fresher one. Wrapped with its own separator so
               hiding it (no token, no configured workflow) does not leave a stray "·". -->
          <span id="syncWrap" hidden><button type="button" class="foot-sync" id="syncNow">sync now</button> ·</span>
          <a href="ROADMAP.md">flat digest</a> ·
          <a href="data/roadmap.json">roadmap.json</a> ·
          <a id="sourceLink" href="#">source</a>
        </footer>
      </div>
    </div>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ⌘K command palette — the search input lives here now, opened by ⌘K / the trigger -->
    <div class="cmdk-overlay" id="cmdkOverlay" hidden>
      <div class="cmdk-box">
        <div class="search-wrap">
          <input
            id="search"
            type="search"
            placeholder="Search or run a command…"
            autocomplete="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="searchSuggest"
            aria-expanded="false"
          />
          <kbd id="cmdkHint" class="cmdk-hint">⌘K</kbd>
          <button id="searchClear" class="search-clear" type="button" aria-label="Clear search" hidden></button>
          <ul id="searchSuggest" class="suggest" role="listbox" aria-label="Search suggestions" hidden></ul>
        </div>
      </div>
    </div>

    <!-- Generated payload, loaded as a global so the page also works from file://. -->
    <script src="data/roadmap.js" onerror="window.__ROADMAP_LOAD_ERROR__=true"></script>
    <script src="app.js"></script>
  </body>
</html>
