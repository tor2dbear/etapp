name: Check

# What a contributor would run before pushing, run for them — because until now
# nothing ran on a pull request at all. `sync.yml` triggers on a schedule and on
# pushes to main, so a branch could be reviewed, approved and merged without a single
# automated check having looked at it. The first slice of the codebase review found
# fourteen defects by hand for exactly that reason.
#
# Runs on every pull request, and on pushes to main for the same paths, so a direct
# push is covered too. Deliberately not on `data/**`: the hourly harvest commits there
# and its output is checked by the job that produced it.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "app.js"
      - "format.js"
      - "index.html"
      - "tests/**"
      - "sources.json"
      - "board.config.json"
      - ".assetsignore"
      - ".github/workflows/check.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cheapest gate first: a file that does not parse fails everything after it,
      # and app.js is 11k lines that nothing else compiles. Globbed rather than listed:
      # the list was written in the same commit that added format.js and left it out.
      - name: Syntax
        run: |
          set -euo pipefail
          for f in *.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f"
          done
          echo "✓ all JavaScript parses"

      # Would anything unintended be published? The bundle is the repo root, so a new
      # file is published unless something says otherwise. Already run from
      # `predeploy`; running it here means the answer arrives before review, not after.
      - name: Bundle
        run: node scripts/check-bundle.mjs

      # Both judges below read the product's own output with a parser that has never
      # heard of this codebase. That is the only arrangement that can answer "is this
      # valid to anyone else", and both are CI-only: nothing here ships, and a second
      # implementation of either format inside the product would defeat the purpose.
      #
      # PyYAML is the point of the format step, not an implementation detail. Our own
      # parser accepts things no YAML parser does, so "it round-trips for us" was never
      # evidence that a puck is valid to anyone else — and pucks are read by other
      # people's tools in other people's repos.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format judge
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 scripts/check-format.py

      # The renderer's safety property is that it escapes first and emits a fixed
      # whitelist of tags, and the thing that decides whether it held is a *parser*,
      # not our own reading of the output. html.parser is stdlib, so this installs
      # nothing. It also holds the renderer to CONVENTION's documented subset and to
      # its one promise about everything outside it — `tests/markdown.fixture.md` has
      # been named there as the text that does this since before the file existed.
      - name: Markdown judge
        run: python3 scripts/check-markdown.py
